<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src *;" />
<title>Микро-мессенджер</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Экран входа / регистрации -->
<div id="auth-screen" class="screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-dot"></span>
      микро-мессенджер
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Адрес сервера
        <input type="text" id="login-server" placeholder="192.168.1.5:3000" required />
      </label>
      <label>Ник
        <input type="text" id="login-username" placeholder="_Defender13_" required />
      </label>
      <label>Пароль
        <input type="password" id="login-password" required />
      </label>
      <button type="submit" class="btn-primary">Войти</button>
      <div class="auth-error" id="login-error"></div>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label>Адрес сервера
        <input type="text" id="register-server" placeholder="192.168.1.5:3000" required />
      </label>
      <label>Ник
        <input type="text" id="register-username" placeholder="Как в инвайте" required />
      </label>
      <label>Пароль
        <input type="password" id="register-password" placeholder="Минимум 6 символов" required />
      </label>
      <label>Код приглашения
        <input type="text" id="register-invite" placeholder="Код от админа" required />
      </label>
      <button type="submit" class="btn-primary">Зарегистрироваться</button>
      <div class="auth-error" id="register-error"></div>
    </form>
  </div>
</div>

<!-- Экран чата -->
<div id="chat-screen" class="screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">подключение...</span>
      <button id="logout-btn" title="Выйти">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="chat-list" id="chat-list">
      <button class="chat-item active" data-chat="lobby">
        <span class="chat-item-name"># Общий чат</span>
      </button>
    </div>

    <div class="sidebar-footer" id="sidebar-footer">
      <span id="me-username"></span>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <span id="current-chat-title"># Общий чат</span>
    </header>

    <div class="messages" id="messages"></div>

    <form id="send-form" class="send-form">
      <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </main>
</div>

<script src="renderer.js"></script>
</body>
</html>
